<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Commit skyline — building">
<title>Commit skyline — building</title><desc>Placeholder shown until the daily GitHub Action generates the 3D contribution skyline.</desc>
<defs><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.orb{font-family:'Orb',Verdana,sans-serif}.raj{font-family:'Raj','Segoe UI',Arial,sans-serif}.mono{font-family:'JBM',Consolas,'Liberation Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shine{0%{transform:translateX(-420px) skewX(-18deg)}55%,100%{transform:translateX(1400px) skewX(-18deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spinf{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 26s linear infinite}
.blink{animation:blink 1.05s step-end infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.flow{stroke-dasharray:6 4;animation:flow 1.6s linear infinite}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1.4s cubic-bezier(.2,.8,.2,1) both}
</style>
<linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0708"/><stop offset=".55" stop-color="#160C0F"/><stop offset="1" stop-color="#0D0809"/></linearGradient>
<radialGradient id="pgr" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 75) scale(486 210)"><stop offset="0" stop-color="#E0283C" stop-opacity=".22"/><stop offset="1" stop-color="#E0283C" stop-opacity="0"/></radialGradient>
<radialGradient id="pgg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 255) scale(448 180)"><stop offset="0" stop-color="#F4B63F" stop-opacity=".10"/><stop offset="1" stop-color="#F4B63F" stop-opacity="0"/></radialGradient>
<linearGradient id="pedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0283C" stop-opacity=".75"/><stop offset=".5" stop-color="#3A1F24" stop-opacity=".9"/><stop offset="1" stop-color="#F4B63F" stop-opacity=".6"/></linearGradient>
<pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#ffffff" fill-opacity=".055"/></pattern>
<clipPath id="pclip"><rect width="1280" height="300" rx="22"/></clipPath>
<filter id="pglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="psoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<g clip-path="url(#pclip)">
<rect width="1280" height="300" fill="url(#pbg)"/>
<rect width="1280" height="300" fill="url(#pgr)"/>
<rect width="1280" height="300" fill="url(#pgg)"/>
<rect width="1280" height="300" fill="url(#pdots)"/>
</g>
<g transform="translate(640 150)">
<circle r="70" fill="none" stroke="#F4B63F" stroke-opacity=".3" stroke-width="7" stroke-dasharray="1.2 7" class="spin"/>
<circle r="54" fill="none" stroke="#E0283C" stroke-opacity=".6" stroke-width="2" stroke-dasharray="40 14 4 14" class="spinr"/></g>
<g transform="translate(622 132) scale(1.5000)"><path d="M3 12.5h3.5l2-5 3.5 10 2.5-7 1.5 2H21" fill="none" stroke="#F4B63F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="640" y="258" text-anchor="middle" class="mono" font-size="12" letter-spacing="2.4" fill="#B9A9A2">COMMIT SKYLINE · FIRST BUILD IN PROGRESS<tspan class="blink">_</tspan></text>
<rect x=".75" y=".75" width="1278.5" height="298.5" rx="21.5" fill="none" stroke="url(#pedge)" stroke-width="1.5"/>
<g stroke="#F4B63F" stroke-width="1.6" stroke-opacity=".55" fill="none">
<path d="M14 32V14h18"/><path d="M1248 14H1266v18"/><path d="M14 268V286h18"/><path d="M1248 286H1266v-18"/></g>
</svg>