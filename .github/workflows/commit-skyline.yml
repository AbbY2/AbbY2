name: Commit skyline (3D contributions)

on:
  schedule:
    - cron: "30 20 * * *"   # every day at 02:00 IST
  workflow_dispatch:         # run it any time from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate hot-rod 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh commit skyline"; then
            git push
          fi
