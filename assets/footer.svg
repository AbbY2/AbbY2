<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="Suit up. Ship clean. Repeat.">
<title>Suit up. Ship clean. Repeat.</title><desc>A gold heartbeat line pulses across a dark strip behind the motto Suit up, ship clean, repeat.</desc>
<defs><style>@font-face{font-family:'Orb';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.orb{font-family:'Orb',Verdana,sans-serif}.raj{font-family:'Raj','Segoe UI',Arial,sans-serif}.mono{font-family:'JBM',Consolas,'Liberation Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shine{0%{transform:translateX(-420px) skewX(-18deg)}55%,100%{transform:translateX(1400px) skewX(-18deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spinf{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 26s linear infinite}
.blink{animation:blink 1.05s step-end infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.flow{stroke-dasharray:6 4;animation:flow 1.6s linear infinite}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.growx{transform-box:fill-box;transform-origin:left center;animation:growx 1.4s cubic-bezier(.2,.8,.2,1) both}

@keyframes ekg{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
.ekg{stroke-dasharray:260 1140;animation:ekg 4s linear infinite}
</style>
<linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0708"/><stop offset=".55" stop-color="#160C0F"/><stop offset="1" stop-color="#0D0809"/></linearGradient>
<radialGradient id="fgr" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 38) scale(486 105)"><stop offset="0" stop-color="#E0283C" stop-opacity=".22"/><stop offset="1" stop-color="#E0283C" stop-opacity="0"/></radialGradient>
<radialGradient id="fgg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 128) scale(448 90)"><stop offset="0" stop-color="#F4B63F" stop-opacity=".10"/><stop offset="1" stop-color="#F4B63F" stop-opacity="0"/></radialGradient>
<linearGradient id="fedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0283C" stop-opacity=".75"/><stop offset=".5" stop-color="#3A1F24" stop-opacity=".9"/><stop offset="1" stop-color="#F4B63F" stop-opacity=".6"/></linearGradient>
<pattern id="fdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#ffffff" fill-opacity=".055"/></pattern>
<clipPath id="fclip"><rect width="1280" height="150" rx="22"/></clipPath>
<filter id="fglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="fsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<g clip-path="url(#fclip)">
<rect width="1280" height="150" fill="url(#fbg)"/>
<rect width="1280" height="150" fill="url(#fgr)"/>
<rect width="1280" height="150" fill="url(#fgg)"/>
<rect width="1280" height="150" fill="url(#fdots)"/>
</g>
